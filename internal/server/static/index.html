<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wellness Gateway</title>
<link rel="stylesheet" href="/ui/app.css">
<script>try{var th=localStorage.getItem("wg.theme");if(th&&th!=="system")document.documentElement.dataset.theme=th;}catch(e){}</script>
<link rel="icon" href="/ui/icon.png">
</head>
<body>
<header>
  <div class="brand"><img src="/ui/icon.png" alt=""><span>Wellness Gateway</span><small id="version"></small></div>
  <nav id="nav" hidden>
    <button data-view="dashboard">Prenotazioni</button>
    <button data-view="classes">Lezioni</button>
    <button data-view="profiles">Profili</button>
    <button data-view="settings">Impostazioni</button>
    <button data-view="log">Registro</button>
    <button id="logout" class="ghost">Esci</button>
  </nav>
</header>
<main id="main"></main>
<footer>Wellness Gateway · © 2026 Simone Di Mambro · MIT · <a href="https://github.com/sidimam/wellness-gateway" target="_blank" rel="noopener">GitHub</a></footer>

</html>
